name: Flutter unit tests (mobile)

on:
  pull_request:
  push:
    branches:
      - feat/sync-replay-migrations
      - main

jobs:
  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies (mobile)
        working-directory: flutter_app/mobile
        run: flutter pub get

      - name: Run unit tests (mobile)
        working-directory: flutter_app/mobile
        env:
          PUB_ENVIRONMENT: 'github_actions'
        run: |
          # Ensure tests run headless and deterministic
          flutter test --no-sound-null-safety --run-ignore=integration_test || flutter test --no-sound-null-safety
