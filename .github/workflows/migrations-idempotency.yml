name: Migrations idempotency & replay smoke tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  migrations-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic

      - name: Run alembic upgrade head (first)
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run alembic upgrade head (second run for idempotency)
        working-directory: backend
        run: |
          set -o pipefail; alembic upgrade head

      - name: Run replay dry-run smoke test
        working-directory: backend
        run: |
          python scripts/replay_changes.py --from 0 --to 1 --dry-run || true

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -q
