name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests & migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_dev" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_dev
        run: |
          cd backend
          pytest -q
      - name: Run alembic migrations (dry-run)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_dev
        run: |
          cd backend
          alembic upgrade head

  mobile:
    name: Flutter analyze & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Install dependencies
        run: |
          cd flutter_app/mobile
          flutter pub get
      - name: Analyze
        run: |
          cd flutter_app/mobile
          flutter analyze
      - name: Run unit tests
        env:
          NO_PROXY: '127.0.0.1,localhost'
        run: |
          cd flutter_app/mobile
          flutter test --coverage
