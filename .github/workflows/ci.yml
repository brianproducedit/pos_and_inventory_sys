name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests & migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_dev" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest "httpx<0.28" pytest-asyncio
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_dev
        run: |
          cd backend
          pytest -q
      - name: Run alembic migrations (dry-run)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_dev
        run: |
          cd backend
          alembic upgrade head

  mobile:
    name: Flutter analyze & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
      - name: Install dependencies
        working-directory: flutter_app/mobile
        run: flutter pub get
      - name: Create stub .env for code generation
        working-directory: flutter_app/mobile
        run: echo "BASE_URL=http://localhost:8000" > .env
      - name: Generate code
        working-directory: flutter_app/mobile
        run: dart run build_runner build
      - name: Analyze
        working-directory: flutter_app/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit tests
        working-directory: flutter_app/mobile
        env:
          NO_PROXY: '127.0.0.1,localhost'
        run: flutter test test/auth_service_test.dart test/db_pragmas_test.dart test/workmanager_helper_test.dart
