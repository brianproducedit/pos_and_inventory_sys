name: Integration tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    name: e2e: POS checkout
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run e2e test
        run: |
          set -o pipefail
          flutter test test/e2e/pos_checkout_e2e_test.dart -r expanded 2>&1 | tee test-e2e-output.txt

      - name: Upload e2e test output
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output
          path: test-e2e-output.txt
